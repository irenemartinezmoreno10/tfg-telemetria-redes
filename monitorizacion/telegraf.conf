# Configuración de Telegraf (colector SNMP): consulta los dos routers por SNMP cada 30 s, recibe
# sus traps y escribe todo en InfluxDB, junto a lo que recoge gnmic por gNMI
# - snmp_interfaz (polling): oper_status (ifOperStatus de ethernet-1/1, 1 = up, 2 = down) e
#   in_octets / out_octets (ifHCInOctets / ifHCOutOctets de ethernet-1/1)
# - snmp_trap: traps que envían los routers (linkDown / linkUp, entre otros)
# ethernet-1/1 tiene el ifIndex 16382 en SR Linux

[agent]
  interval = "30s"              # intervalo de polling SNMP
  flush_interval = "1s"         # escribe en InfluxDB en cuanto tiene datos
  omit_hostname = true
  snmp_translator = "gosmi"     # traduce los OID con los MIB de mibs/ (montados en /etc/telegraf/mibs)

[[outputs.influxdb_v2]]
  urls = ["http://172.20.20.10:8086"]   # IP fija de influxdb en la topología
  token = "tfg-token"
  organization = "tfg"
  bucket = "telemetria"

[[inputs.snmp]]
  name = "snmp_interfaz"        # measurement en InfluxDB
  agents = ["udp://172.20.20.2:161", "udp://172.20.20.3:161"]
  version = 2
  community = "public"
  timeout = "5s"
  retries = 1
  agent_host_tag = "source"     # mismo nombre de etiqueta que usa gnmic, para que el panel los trate igual
  path = ["/etc/telegraf/mibs"]

  [[inputs.snmp.field]]
    name = "oper_status"
    oid = "1.3.6.1.2.1.2.2.1.8.16382"

  [[inputs.snmp.field]]
    name = "in_octets"
    oid = "1.3.6.1.2.1.31.1.1.1.6.16382"

  [[inputs.snmp.field]]
    name = "out_octets"
    oid = "1.3.6.1.2.1.31.1.1.1.10.16382"

[[inputs.snmp_trap]]
  service_address = "udp://:162"   # los routers envían los traps a 172.20.20.13:162
  path = ["/etc/telegraf/mibs"]    # sin los MIB, Telegraf no puede traducir los OID y descarta los traps
